name: CI/CD Terraform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Operation to perform"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

env:
  TF_VERSION: "1.16.5"
  AWS_REGION: "eu-west-1"

jobs:

  Terraform-security:
    name: Terraform Security & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Execute TFLint
        run: tflint

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true

 
  Terraform-validate:
    name: Terraform Validate, Cost & Plan
    runs-on: ubuntu-latest
    needs: Terraform-security

    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.action == 'deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'pull_request'
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -no-color

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Cost Estimation
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path . \
            --format table \
            --out-file infracost.txt

          cat infracost.txt

  Approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: Terraform-validate

    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'deploy'
        )
      )

    environment: production

    steps:
      - name: Approval confirmed
        run: echo "Production approval granted."


  Terraform-deployment:
    name: Deploy on AWS
    runs-on: ubuntu-latest
    needs: Approval

    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'deploy'
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve


  Test-post-deployment:
    name: Test Post-Deployment
    runs-on: ubuntu-latest
    needs: Terraform-deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: SG id added
        run: |
          echo "SG_ID=$(terraform output -raw mon_ec2_sg_id)" >> $GITHUB_ENV

      - name: IP runner added
        id: get-ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Open the port 8080
        run: aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 8080 --cidr ${{ steps.get-ip.outputs.RUNNER_IP }}/32 
        

      - name: Flask Health Check
        run: |
          EC2_IP=$(terraform output -raw app_tigre_bleu_ip 2>/dev/null) || true

          if [ -z "$EC2_IP" ]; then
            echo "Could not get EC2 IP"
            exit 1
          fi

          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              "http://$EC2_IP:8080/health" 2>/dev/null) || true

            if [ "$STATUS" = "200" ]; then
              echo "Flask health check passed"
              exit 0
            fi

            echo "Attempt $i/12 - waiting 30s..."
            sleep 30
          done

          echo "Health check failed"
          exit 1

      - name: Close the open port on Security group ec2
        if: always()
        run: aws ec2 revoke-security-group-ingress --group-id $SG_ID --protocol tcp --port 8080 --cidr ${{ steps.get-ip.outputs.RUNNER_IP }}/32 


      - name: Test AI Lambda
        run: |
          echo "Testing AI analysis Lambda..."

          aws lambda invoke \
            --function-name ai-tracking-inventory-analysis \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json

          cat response.json
          echo "AI Lambda invocation completed"

      - name: Test RDS
        continue-on-error: true
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ai-inventory-db \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)

          echo "RDS Status: $STATUS"

          if [ "$STATUS" = "available" ]; then
            echo "RDS is available"
          else
            echo "RDS is not available"
            exit 1
          fi


  Terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: Terraform-security

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform destroy -auto-approve